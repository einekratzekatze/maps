plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

android {
    compileSdk = 36
    namespace = 'io.github.einekratzekatze.maps'
    buildFeatures {
        buildConfig = true
        compose = true
    }
    dependenciesInfo {
        // Disable including dependency metadata when building APKs
        includeInApk = false
        // Disable including dependency metadata when building Android App Bundles
        includeInBundle = false
    }
    defaultConfig {
        applicationId = "io.github.einekratzekatze.maps"
        minSdk = 26
        targetSdk = 36
        versionCode = 1
        versionName = "0.1.0"
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            minifyEnabled false
        }
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
        unitTests.all {
            // Robolectric 4.17 on JDK 21+ needs access to JDK internals
            jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
        }
    }
    lint {
        abortOnError false
        disable 'MissingTranslation'
    }
}

ksp {
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.webkit:webkit:1.15.0'
    implementation 'androidx.activity:activity-ktx:1.13.0'
    implementation 'androidx.activity:activity-compose:1.12.0'

    def composeBom = platform('androidx.compose:compose-bom:2025.12.01')
    implementation composeBom
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
    testImplementation composeBom
    androidTestImplementation composeBom
    testImplementation 'androidx.compose.ui:ui-test-junit4'
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'

    implementation 'com.google.dagger:hilt-android:2.60.1'
    ksp 'com.google.dagger:hilt-compiler:2.60.1'

    implementation 'androidx.room:room-runtime:2.8.5'
    implementation 'androidx.room:room-ktx:2.8.5'
    ksp 'androidx.room:room-compiler:2.8.5'

    implementation 'androidx.datastore:datastore-preferences:1.2.0'
    implementation 'androidx.work:work-runtime-ktx:2.11.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.17'
    testImplementation 'com.google.dagger:hilt-android-testing:2.60.1'
    kspTest 'com.google.dagger:hilt-compiler:2.60.1'
}
